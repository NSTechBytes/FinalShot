X=20
Y=242
FontSize=13
FontWeight=600
FontColor=120,200,120
AntiAlias=1

; --- Start Snap  X=20, W=130, center=85 ---
[Btn_StartSnap_BG]
Meter=Shape
X=20
Y=265
This=Fill Color 40,45,55,100
Shape=Rectangle 0,0,130,64,5 | StrokeWidth 0.5 | StrokeColor 80,200,100,200 | Extend This
MouseOverAction=[!SetOption #CURRENTSECTION# This "Fill Color 30,60,40,180"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# This "Fill Color 40,45,55,100"][!UpdateMeter #CURRENTSECTION#][!Redraw]
ToolTipText=Start GIF recording — draw region
LeftMouseUpAction=[!CommandMeasure Measure_FinalShot "-gif-start-snap"][!UpdateMeterGroup StatusGroup][!Redraw]
