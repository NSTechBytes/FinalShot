[Rainmeter]
Update=500
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=FinalShot — GIF Recorder
Author=nstechbytes
Information=GIF recording controls and live status for FinalShot.
Version=1.7.1

;------------- Measure ------------------------------
[Measure_FinalShot]
Measure=Plugin
Plugin=FinalShot
SavePath=#@#Screenshots\Screenshot.png
ShowCursor=1
ShowNotification=1
; UI theme for all popup windows: 0=Dark (default), 1=Light, 2=System
UITheme=0
; Bang to execute when the notification toast is clicked:
NotificationClickAction=
PredefX=#CURRENTCONFIGX#
PredefY=#CURRENTCONFIGY#
PredefWidth=#CURRENTCONFIGWIDTH#
PredefHeight=#CURRENTCONFIGHEIGHT#
DebugLog=1
DebugLogPath=#@#FinalShotDebug.log
GifSavePath=#@#Screenshots\Capture.gif
GifFPS=15
GifDuration=0
GifStartAction=[!UpdateMeterGroup StatusGroup][!Redraw]
GifCancelAction=[!UpdateMeterGroup StatusGroup][!Redraw]
GifEncodingAction=[!UpdateMeterGroup StatusGroup][!Redraw]
GifPredefX=100
GifPredefY=100
GifPredefWidth=800
GifPredefHeight=600
GifShowOverlay=1
GifShowEncodingWindow=1
GifShowStateDialogs=1

;------------- Background ------------------------------
[Background_Shape]
Meter=Shape
Shape=Rectangle 0,0,600,640,8 | StrokeWidth 0 | FillColor 13,17,23

;------------- Header ------------------------------
[Header_Text]
Meter=String
Text=FinalShot v1.7.1 #CRLF#by nstechbytes
X=20
Y=20
FontWeight=700
FontSize=20
FontColor=255,255,255
InlinePattern=v1.7.1
InlineSetting=Color | 70,130,255
InlinePattern2=by nstechbytes
InlineSetting2=Size | 12
InlinePattern3=by nstechbytes
InlineSetting3=Color | 180,180,180
AntiAlias=1

[Divider_Line]
Meter=Shape
Shape=Line 20,75,580,75 | StrokeWidth 1 | StrokeColor 40,45,55,200

