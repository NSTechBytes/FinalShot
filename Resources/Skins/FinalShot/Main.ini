[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=FinalShot
Author=nstechbytes
Information=An advanced, stylish skin to test the FinalShot screenshot plugin.
Version=1.7.1

;-------------Measures ------------------------------
[Measure_FinalShot]
Measure=Plugin
Plugin=FinalShot
; Where to save the screenshot:
SavePath=#@#Screenshots\Screenshot.png
; 1 = include cursor, 0 = no cursor
ShowCursor=1
; 1 = show notification with image preview, 0 = no notification
ShowNotification=1
; UI theme for all popup windows: 0=Dark (default), 1=Light, 2=System
UITheme=0
; Bang to execute when the notification toast is clicked (leave empty for none):
OnNotificationClickAction=
; Predefined region (for -ps):
PredefX=#CURRENTCONFIGX#
PredefY=#CURRENTCONFIGY#
PredefWidth=#CURRENTCONFIGWIDTH#
PredefHeight=#CURRENTCONFIGHEIGHT#
; After saving, execute this bang or app:
ScreenshotFinishAction=[!Log "Screenshot taken!"]
; Enable debug logging (1 = on, 0 = off)
DebugLog=1
; (Optional) custom log path:
DebugLogPath=#@#FinalShotDebug.log
DynamicVariables=1
;-------------MeterStyles ------------------------------
[Icons_BackGround_Shape]
X=25R
Y=100
This=Fill Color 40,45,55,100
Shape=Rectangle 0,0,120,120,5 | StrokeWidth 0.5 | StrokeColor 180,180,180 | Extend This
MouseOverAction=[!SetOption #CURRENTSECTION# This "Fill Color 40,45,55,50"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# This "Fill Color 40,45,55,100"][!UpdateMeter #CURRENTSECTION#][!Redraw]
DynamicVariables=1

[Icons_BackGround_Image]
X=10r
Y=10r
W=100
H=100

;-------------Content ------------------------------
[Background_Shape]
Meter=Shape 
Shape=Rectangle 0,0,600,320,8 | StrokeWidth 0 | FillColor 13,17,23

[Header_Text]
Meter=String
Text=FinalShot v1.7.1 #CRLF#by nstechbytes
X=20
Y=20
FontWeight=700
FontSize=20
FontColor=255,255,255
InlinePattern=v1.7.1
InlineSetting=Color | 70,130,255
InlinePattern2=by nstechbytes
InlineSetting2=Size | 12
InlinePattern3=by nstechbytes
InlineSetting3=Color | 180,180,180
AntiAlias=1

[FullScreen_BackGround]
Meter=Shape
X=35
MeterStyle=Icons_BackGround_Shape
ToolTipText=Capture FullScreen
LeftMouseUpAction=[!CommandMeasure Measure_FinalShot "-fs"]
[FullScreen_BackGround_Icons]
Meter=Image
ImageName="#@#\icons\FullScreen.png"
MeterStyle=Icons_BackGround_Image

[Snap_BackGround]
Meter=Shape
MeterStyle=Icons_BackGround_Shape
ToolTipText=Take Snap
LeftMouseUpAction=[!CommandMeasure Measure_FinalShot "-cs"]
[Snap_BackGround_Icons]
Meter=Image
ImageName="#@#\icons\Snap.png"
MeterStyle=Icons_BackGround_Image

[Predefined_BackGround]
Meter=Shape
MeterStyle=Icons_BackGround_Shape
ToolTipText=Capture current skin with Predefined
LeftMouseUpAction=[!CommandMeasure Measure_FinalShot "-ps"]
[Predefined_BackGround_Icons]
Meter=Image
ImageName="#@#\icons\Predefined.png"
MeterStyle=Icons_BackGround_Image

[Window_BackGround]
Meter=Shape
MeterStyle=Icons_BackGround_Shape
ToolTipText=Capture Window (Example: Notepad)
LeftMouseUpAction=[!CommandMeasure Measure_FinalShot "-ws|Untitled - Notepad"]
[Window_BackGround_Icons]
Meter=Image
ImageName="#@#\icons\Window.png"
MeterStyle=Icons_BackGround_Image

[Footer_Text]
Meter=String
Text=© 2025 @nstechbytes. All rights reserved.
X=20
Y=290
FontSize=12
FontColor=255,255,255,150
AntiAlias=1