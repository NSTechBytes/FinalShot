[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=FinalShot
Author=nstechbytes
Information=An advanced, stylish skin to test the FinalShot screenshot plugin.
Version=1.7.1

;------------- Measures ------------------------------
[Measure_FinalShot]
Measure=Plugin
Plugin=FinalShot
; Where to save the screenshot:
SavePath=#@#Screenshots\Screenshot.png
; 1 = include cursor, 0 = no cursor
ShowCursor=1
; 1 = show notification with image preview, 0 = no notification
ShowNotification=1
; Predefined region (for -ps):
PredefX=#CURRENTCONFIGX#
PredefY=#CURRENTCONFIGY#
PredefWidth=#CURRENTCONFIGWIDTH#
PredefHeight=#CURRENTCONFIGHEIGHT#
; After saving, execute this bang or app:
ScreenshotFinishAction=[!Log "Screenshot taken!"]
; Enable debug logging (1 = on, 0 = off)
DebugLog=1
; (Optional) custom log path:
DebugLogPath=#@#FinalShotDebug.log
; ---------- GIF capture settings ----------
; Full path where the animated GIF will be saved:
GifSavePath=#@#Screenshots\Capture.gif
; Frames per second (1-30, default 10):
GifFPS=30
; Recording duration in seconds (0 = record until -gif-stop is sent):
GifDuration=0
; GIF encoding quality level, 1–5 (default 3):
;   1 = Low (64 colors, fast, no dither)
;   2 = Medium-Low (128 colors, no dither)
;   3 = Medium — default (256 colors, 40K samples, dither)
;   4 = High (256 colors, 80K samples, dither)
;   5 = Ultra (256 colors, 150K samples, dither)
GifQualityLevel=3
; GIF compression level, 1–3 (default 2):
;   1 = Aggressive (drop + merge duplicate frames — smallest file)
;   2 = Normal — default (drop duplicate frames)
;   3 = Off (write every frame — largest file, best for fast motion)
GifCompressionLevel=2
; Fired the moment GIF recording starts (capture thread launched).
; Use this to show a "REC" indicator or turn a button red:
GifStartAction=[!Log "GIF recording started"]
; Fired after a recording is cancelled via -gif-cancel (no file saved).
; Use this to reset the skin UI back to its idle state:
GifCancelAction=[!Log "GIF recording cancelled"]
; Fired when encoding begins (capture done, frames being written to file).
; Use this to show an "Encoding..." label while the user waits:
OnGifEncodingAction=[!Log "GIF encoding started"]
; DynamicVariables=1
GifPredefX=100
GifPredefY=100
GifPredefWidth=800
GifPredefHeight=600
GifShowOverlay=1 
;------------- MeterStyles ------------------------------
[Icons_BackGround_Shape]
X=25R
Y=100
This=Fill Color 40,45,55,100
Shape=Rectangle 0,0,120,120,5 | StrokeWidth 0.5 | StrokeColor 180,180,180 | Extend This
MouseOverAction=[!SetOption #CURRENTSECTION# This "Fill Color 40,45,55,50"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# This "Fill Color 40,45,55,100"][!UpdateMeter #CURRENTSECTION#][!Redraw]
DynamicVariables=1

[Icons_BackGround_Image]
X=10r
Y=10r
W=100
H=100

